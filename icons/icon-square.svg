<!--
  The same mark as icon.svg, on a full-bleed square with no border.

  ── Why there are two sources rather than one ──────────────────────────────

  This one exists for `apple-touch-icon.png` alone. iOS masks a home-screen icon
  itself, into the superellipse it uses everywhere, and it composites away any
  alpha channel — so a rounded plate with transparent corners arrives as a rounded
  plate sitting inside a black square. The plate has to reach all four corners
  here, which is the opposite of what the browser-tab favicon needs.

  The hairline border goes with the rounding, and that is a judgement rather than
  a requirement: iOS's superellipse and this file's circular corner arc are close
  but not the same curve, so an inset rounded rectangle survives the mask along
  the edges and gets clipped unevenly at the corners. A rim that is even on three
  corners and shaved on the fourth is worse than no rim.

  Lunicle ships no native app, so unlike LunaPin's file of the same name this one
  feeds no app-icon set — it is the web page being added to a phone's home screen,
  and nothing else.

  ── The duplication is checked, not trusted ────────────────────────────────

  The mark group below is byte-for-byte the one in icon.svg, and
  scripts/make-icons.sh refuses to run if the two ever stop agreeing — so the mark
  cannot quietly fork into an iOS version and a web version.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lunicle">
  <defs>
    <linearGradient id="lnlMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7f0c4"/>
      <stop offset="1" stop-color="#6ee7a0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="#08110c"/>
  <g transform="translate(4 4)" fill="none" stroke="url(#lnlMint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="3.5" width="19" height="17" rx="2.5"/>
    <path d="M4.5 8 h4 M10 8 h4 M15.5 8 h4 M4.5 12 h4 M10 12 h4 M4.5 16 h4"/>
  </g>
</svg>
